; Local PHP settings for LMS HNDIT (project-level)
; In many XAMPP setups, .user.ini in the project root is applied by PHP-FPM/Apache per-directory.
; After creating this file, restart Apache via XAMPP Control Panel for changes to take effect.

upload_max_filesize = 50M
post_max_size = 55M
memory_limit = 256M
max_execution_time = 300

; Note: If your Apache instance ignores .user.ini, edit C:\xampp\php\php.ini instead and restart Apache.
